name: KERNEL BUILDER

on:
  workflow_dispatch:
    inputs:
      linux:
        description: Atur Linux
        type: choice
        default: Ubuntu LTS
        options:
          - Ubuntu LTS
          - Ubuntu 24.04
          - Ubuntu 22.04
          - Debian 12
          - Debian 11
          - Arch Linux
      nama_kernel:
        description: Atur Nama Kernel
        type: string
        default: "-〩Beler"
      kernel_url:
        description: Atur Kernel URL
        type: string
        default: https://github.com/awangunawan12332122-lab/android_kernel_xiaomi_sdm845_419
      kernel_branch:
        description: Atur Branch Kernel
        type: string
        default: "17"
      defconfig:
        description: Atur Defconfig
        type: string
        default: beryllium_defconfig
      root_manager:
        description: Atur Root Manager
        type: choice
        default: Tidak ada
        options:
          - Tidak ada
          - Magisk
          - APatch
          - KernelSU
          - KernelSU-Next
          - SukiSU-Ultra
          - ReSukiSU
      lto:
        description: Atur LTO
        type: choice
        default: Aktif
        options:
          - Aktif
          - Nonaktif
      toolchain:
        description: Atur Toolchain
        type: choice
        default: Bawaan 4.19 (Clang)
        options:
          - Bawaan 4.19 (Clang)
          - Proton-Clang
          - AOSP-Clang
          - Bawaan 4.9 (GCC)
          - Proton-GCC
      device:
        description: Atur AnyKernel3
        type: choice
        default: POCO F1
        options:
          - POCO F1
          - Repo Asli
      anykernel_url:
        description: Atur AnyKernel3 Repo
        type: string
        default: https://github.com/osm0sis/AnyKernel3
      anykernel_branch:
        description: Atur AnyKernel3 Branch
        type: string
        default: master

jobs:
  build:
    runs-on: ${{ inputs.linux == 'Ubuntu LTS' && 'ubuntu-latest' || inputs.linux == 'Ubuntu 24.04' && 'ubuntu-24.04' || 'ubuntu-22.04' }}
    container: ${{ inputs.linux == 'Debian 12' && 'debian:bookworm' || inputs.linux == 'Debian 11' && 'debian:bullseye' || inputs.linux == 'Arch Linux' && 'archlinux:latest' || '' }}
    env:
      ARCH: arm64
    steps:
      - name: Persiapan Sistem
        run: |
          export DEBIAN_FRONTEND=noninteractive
          if [ "$(id -u)" != "0" ] && command -v sudo > /dev/null; then SUDO=sudo; else SUDO=; fi
          if command -v apt > /dev/null; then
            $SUDO apt update -y
            $SUDO apt install -y git curl wget bc bison flex libssl-dev libelf-dev cpio rsync lz4 zstd python3 zip make gcc g++ clang lld llvm gcc-aarch64-linux-gnu
          else
            pacman -Sy --noconfirm git curl wget bc bison flex openssl libelf cpio rsync lz4 zstd python zip make gcc clang lld llvm aarch64-linux-gnu-gcc
          fi

      - name: Cache Toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: tc-${{ inputs.toolchain }}-t1

      - name: Unduh Toolchain
        run: |
          mkdir -p ~/toolchain
          case "${{ inputs.toolchain }}" in
            "Proton-Clang") [ -x ~/toolchain/proton-clang/bin/clang ] || { rm -rf ~/toolchain/proton-clang; git clone --depth=1 https://github.com/kdrag0n/proton-clang ~/toolchain/proton-clang; } ;;
            "AOSP-Clang") [ -x ~/toolchain/aosp-clang/bin/clang ] || { rm -rf ~/toolchain/aosp-clang; mkdir -p ~/toolchain/aosp-clang; curl -sL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r522817.tar.gz" | tar -xz -C ~/toolchain/aosp-clang; } ;;
            "Bawaan 4.9 (GCC)") [ -x ~/toolchain/gcc-4.9/bin/aarch64-linux-android-gcc ] || { rm -rf ~/toolchain/gcc-4.9; git clone --depth=1 -b android12L-release https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 ~/toolchain/gcc-4.9; } ;;
            "Proton-GCC") [ -d ~/toolchain/proton-gcc/bin ] || { rm -rf ~/toolchain/proton-gcc; git clone --depth=1 https://github.com/kdrag0n/proton-gcc ~/toolchain/proton-gcc; } ;;
          esac

      - name: Cache Kernel
        id: cache-k
        uses: actions/cache@v4
        with:
          path: kernel
          key: kernel-${{ inputs.kernel_url }}-${{ inputs.kernel_branch }}-k1

      - name: Unduh Kernel
        if: steps.cache-k.outputs.cache-hit != 'true'
        run: |
          git clone -b "${{ inputs.kernel_branch }}" ${{ inputs.kernel_url }} kernel || { rm -rf kernel; git clone -b "${{ inputs.kernel_branch }}.0" ${{ inputs.kernel_url }} kernel; }

      - name: Segarkan Kernel
        working-directory: kernel
        run: |
          git checkout -f -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true

      - name: Info Versi
        working-directory: kernel
        run: |
          V=$(grep -E "^VERSION = " Makefile | awk '{print $3}')
          P=$(grep -E "^PATCHLEVEL = " Makefile | awk '{print $3}')
          S=$(grep -E "^SUBLEVEL = " Makefile | awk '{print $3}')
          EXTRA=$(grep -E "^EXTRAVERSION = " Makefile | awk '{print $3}' | tr -d ' ')
          echo "FULL_NAME=${V}.${P}.${S}${EXTRA}${{ inputs.nama_kernel }}" >> $GITHUB_ENV
          echo "Nama Kernel: ${V}.${P}.${S}${EXTRA}${{ inputs.nama_kernel }}"

      - name: Patch Root Manager
        if: inputs.root_manager != 'Tidak ada'
        working-directory: kernel
        run: |
          case "${{ inputs.root_manager }}" in
            "Magisk") echo "Magisk: patching terpisah lewat aplikasi setelah flash, kernel tidak diubah" ;;
            "APatch") echo "APatch: patching terpisah lewat aplikasi setelah flash, kernel tidak diubah" ;;
            "KernelSU") curl -sSL https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s v0.9.5 ;;
            "KernelSU-Next") curl -sSL https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/next/kernel/setup.sh | bash - ;;
            "SukiSU-Ultra") git clone --depth=1 -b main https://github.com/SukiSU-Ultra/SukiSU-Ultra /tmp/suki; cp -r /tmp/suki/kernel drivers/kernelsu; echo "obj-y += kernelsu/" >> drivers/Makefile; echo "source \"drivers/kernelsu/Kconfig\"" >> drivers/Kconfig ;;
            "ReSukiSU") git clone --depth=1 https://github.com/DokiDokiReSuki/ReSukiSU /tmp/resuki; cp -r /tmp/resuki/kernel drivers/resukisu; echo "obj-y += resukisu/" >> drivers/Makefile; echo "source \"drivers/resukisu/Kconfig\"" >> drivers/Kconfig ;;
          esac

      - name: Perbaiki Trace Header
        working-directory: kernel
        run: |
          for f in $(grep -rl "trace/define_trace.h" --include="*.h" .); do
            d=$(dirname $f | sed 's|^\./||')
            sed -i '/#define[[:space:]]*TRACE_INCLUDE_PATH/d' $f
            sed -i "s|#include [<\"]trace/define_trace.h[>\"]|#undef TRACE_INCLUDE_PATH\n#define TRACE_INCLUDE_PATH ../../$d\n#include <trace/define_trace.h>|" $f
          done

      - name: Perbaiki Include Makefile
        working-directory: kernel
        run: |
          INCDIRS=$(find techpack drivers/clk -type d | sed 's|^|-I|' | tr '\n' ' ')
          for m in $(find techpack drivers/clk -name Makefile); do
            grep -qF "$INCDIRS" "$m" || echo "ccflags-y += $INCDIRS" >> "$m"
          done

      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH=~/toolchain/proton-clang/bin:~/toolchain/aosp-clang/bin:~/toolchain/gcc-4.9/bin:~/toolchain/proton-gcc/bin:$PATH
          case "${{ inputs.toolchain }}" in
            "Bawaan 4.9 (GCC)") export CROSS_COMPILE=aarch64-linux-android-; TC=gcc ;;
            "Proton-GCC") export CROSS_COMPILE=aarch64-linux-gnu-; TC=gcc ;;
            *) export CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu LLVM=1 LLVM_IAS=1; TC=clang ;;
          esac
          if [ "$TC" = "gcc" ] && ! ${CROSS_COMPILE}gcc --version >/dev/null 2>&1; then
            echo "GCC prebuilt tidak bisa dijalankan di runner, jatuh ke clang bawaan"
            export CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu LLVM=1 LLVM_IAS=1 TC=clang
          fi
          if [ "$TC" = "gcc" ] && ! command -v ${CROSS_COMPILE}gcc >/dev/null; then
            echo "Compiler ${CROSS_COMPILE}gcc tidak ditemukan di PATH"
            exit 1
          fi
          export KCFLAGS="-Itechpack/audio/asoc -Itechpack/audio/dsp"
          make -j$(nproc) ${{ inputs.defconfig }}
          if [ "${{ inputs.lto }}" = "Aktif" ]; then
            if [ "$TC" = "clang" ]; then
              scripts/config -e LTO_CLANG || true
              scripts/config -e THINLTO || true
              scripts/config -d LTO_NONE || true
              echo "LTO: aktif (clang thin-LTO)"
            else
              echo "LTO: dilewati, toolchain GCC tidak mendukung LTO kernel"
            fi
          else
            scripts/config -d LTO_CLANG || true
            scripts/config -d THINLTO || true
            scripts/config -e LTO_NONE || true
            echo "LTO: nonaktif"
          fi
          RC=1
          for i in 1 2 3 4 5 6; do
            make -j$(nproc) Image.gz-dtb 2>&1 | tee ../build.log
            RC=${PIPESTATUS[0]}
            [ $RC -eq 0 ] && break
            OBJ=$(grep -m1 -E "Makefile.build:[0-9]+: [^ ]+\.o\] Error" ../build.log | sed -E 's|.*Makefile.build:[0-9]+: ([^ ]+\.o)\] Error.*|\1|')
            HDR=$(grep -m1 -E "fatal error:" ../build.log | sed -E "s|.*fatal error: ['\"]([^'\"]+)['\"] file not found.*|\1|;t;s|.*fatal error: ([^:]+): No such file.*|\1|")
            [ -z "$OBJ" ] || [ -z "$HDR" ] && break
            D=$(dirname "$OBJ")
            while [ "$D" != "." ] && [ ! -f "$D/Makefile" ]; do D=$(dirname "$D"); done
            [ -f "$D/Makefile" ] || break
            F=$(find . -type f -name "$(basename "$HDR")" | head -1 | sed 's|^\./||')
            [ -z "$F" ] && break
            ID=$(dirname "$F")
            grep -q "ccflags-y += -I$ID$" "$D/Makefile" && break
            echo "ccflags-y += -I$ID" >> "$D/Makefile"
            echo "percobaan $i: tambah -I$ID ke $D/Makefile untuk $(basename "$HDR")" | tee -a ../perbaikan.log
          done
          if [ $RC -ne 0 ]; then
            echo "=== ERROR PERTAMA ==="
            grep -m1 -B3 -A8 -E "fatal error:|error:" ../build.log
            exit 1
          fi
          if [ ! -f arch/arm64/boot/Image.gz-dtb ]; then
            make -j$(nproc) Image.gz dtbs
            D=$(find arch/arm64/boot/dts -name '*.dtb' | grep -i beryllium | head -1)
            [ -z "$D" ] && D=$(find arch/arm64/boot/dts -name '*.dtb' | head -1)
            cat arch/arm64/boot/Image.gz $D > arch/arm64/boot/Image.gz-dtb
          fi

      - name: Cache AnyKernel3
        id: cache-ak
        uses: actions/cache@v4
        with:
          path: anykernel
          key: ak-${{ inputs.anykernel_url }}-${{ inputs.anykernel_branch }}-a1

      - name: Unduh AnyKernel3
        if: steps.cache-ak.outputs.cache-hit != 'true'
        run: git clone --depth=1 -b ${{ inputs.anykernel_branch }} ${{ inputs.anykernel_url }} anykernel

      - name: Segarkan AnyKernel3
        working-directory: anykernel
        run: |
          git checkout -f -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true

      - name: Tulis anykernel.sh
        if: inputs.device == 'POCO F1'
        run: |
          cat > anykernel/anykernel.sh <<'AK3EOF'
# AnyKernel3 Ramdisk Mod Script
# osm0sis @ xda-developers

## AnyKernel setup
# begin properties
properties() { '
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=beryllium
device.name2=Pocophone F1
device.name3=
device.name4=
device.name5=
supported.versions=
supported.patchlevels=
kernel.string=__KERNEL_STRING__
'; } # end properties

# shell variables
block=/dev/block/bootdevice/by-name/boot;
is_slot_device=0;
ramdisk_compression=auto;
patch_vbmeta_flag=auto;


## AnyKernel methods (DO NOT CHANGE)
# import patching functions/variables - see for reference
. tools/ak3-core.sh;


## AnyKernel file attributes
# set permissions/ownership for included ramdisk files
set_perm_recursive 0 0 755 644 $ramdisk/*;
set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;


## AnyKernel boot install
dump_boot;

write_boot;
## end boot install


# shell variables
#block=vendor_boot;
#is_slot_device=1;
#ramdisk_compression=auto;
#patch_vbmeta_flag=auto;

# reset for vendor_boot patching
#reset_ak;


## AnyKernel vendor_boot install
#split_boot; # skip unpack/repack ramdisk since we don't need vendor_ramdisk access

#flash_boot;
## end vendor_boot install
AK3EOF
          sed -i "s|__KERNEL_STRING__|${FULL_NAME}|" anykernel/anykernel.sh

      - name: Pack ZIP
        run: |
          cp kernel/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          zip -r9 "${FULL_NAME}.zip" . -x ".git/*"
          mv "${FULL_NAME}.zip" ..

      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FULL_NAME }}
          path: ${{ env.FULL_NAME }}.zip

      - name: Laporan Error
        if: always()
        run: |
          {
            echo "## Laporan Build Kernel"
            echo "Run: ${{ github.run_number }} | Toolchain: ${{ inputs.toolchain }} | LTO: ${{ inputs.lto }} | Device: ${{ inputs.device }}"
            if [ -f perbaikan.log ]; then
              echo "### Perbaikan otomatis"
              cat perbaikan.log
            fi
            if [ -f build.log ] && grep -qE "fatal error:|error:" build.log; then
              echo "### Status: GAGAL"
              echo "Error pertama:"
              echo '```'
              grep -m1 -B3 -A8 -E "fatal error:|error:" build.log
              echo '```'
            else
              echo "### Status: SUKSES"
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-build
          path: |
            build.log
            perbaikan.log
          if-no-files-found: ignore
